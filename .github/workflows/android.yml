name: Build Geometry Dash Android Geode Mod
on:
  push:
    branches: [geode-icon-color-pack-android-20261123]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [Android64, Android32]
    steps:
      - uses: actions/checkout@v4
      - name: Build Geode Mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v6.0.0-beta.2
          target: ${{ matrix.target }}
      - name: Save built mod
        uses: actions/upload-artifact@v4
        with:
          name: icon-pack-${{ matrix.target }}
          path: ${{ steps.build.outputs.build-output }}
