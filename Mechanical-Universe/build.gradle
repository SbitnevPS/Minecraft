plugins { id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
version = '0.3.0'
group = 'com.mechanicaluniverse'
base { archivesName = 'mechanicaluniverse' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
 mappings channel: 'official', version: '1.20.1'
 runs {
  client { workingDirectory project.file('run'); mods { mechanicaluniverse { source sourceSets.main } } }
  server { workingDirectory project.file('run'); args '--nogui'; mods { mechanicaluniverse { source sourceSets.main } } }
 }
}
repositories { maven { url = 'https://maven.minecraftforge.net/' } }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.3.0' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
